{% extends 'template.html' %}

{% block titulo %}Novo Produto{% endblock %}

{% block conteudo %}

<div class="page-head">
    <div>
        <span class="section-label">Produtos → Novo</span>
        <h1>Adicionar Produto</h1>
    </div>
    <a href="{% url 'produto' %}" class="btn-ghost-sm">← Voltar</a>
</div>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Cadastrar produto</button>
</form>

{% endblock %}
