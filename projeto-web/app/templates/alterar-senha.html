{% extends 'template.html' %}

{% block titulo %}Alterar Senha{% endblock %}

{% block conteudo %}

<div class="auth-wrap">
    <div class="auth-card">
        <span class="section-label" style="display:block; text-align:center;">Segurança</span>
        <h1>Alterar Senha</h1>
        <p class="auth-sub">Mantenha sua conta segura com uma senha forte.</p>

        <form method="post" style="background:none; border:none; padding:0; box-shadow:none; max-width:none;">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Salvar nova senha" style="width:100%;">
        </form>

        <p class="auth-footer">
            <a href="{% url 'perfil' %}">← Voltar ao perfil</a>
        </p>
    </div>
</div>

{% endblock %}
