{% extends 'template.html' %}

{% block titulo %}Editar Perfil{% endblock %}

{% block conteudo %}

<div class="auth-wrap">
    <div class="auth-card">
        <span class="section-label" style="display:block; text-align:center;">Perfil</span>
        <h1>Editar Perfil</h1>

        <form action="{% url 'editarusuario' %}" method="post" style="background:none; border:none; padding:0; box-shadow:none; max-width:none;">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Salvar alterações" style="width:100%;">
        </form>

        <p class="auth-footer">
            <a href="{% url 'perfil' %}">← Voltar ao perfil</a>
        </p>
    </div>
</div>

{% endblock %}
