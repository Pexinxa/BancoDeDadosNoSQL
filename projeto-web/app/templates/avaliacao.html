{% extends 'template.html' %}

{% block titulo %}Avaliar Compra{% endblock %}

{% block conteudo %}

<div class="auth-wrap">
    <div class="auth-card">
        <span class="section-label" style="display:block; text-align:center;">Sua opinião</span>
        <h1>Nova Avaliação</h1>
        <p class="auth-sub">Avaliando: <strong style="color:var(--accent);">{{ compra.nome_produto }}</strong></p>

        <form method="post" style="background:none; border:none; padding:0; box-shadow:none; max-width:none;">
            {% csrf_token %}

            <label for="nome">Seu nome (público)</label>
            <input type="text" name="nome" id="nome" value="{{ user.username }}" required>

            <label for="nota">Nota (1 a 5)</label>
            <select name="nota" id="nota" required>
                <option value="5">⭐⭐⭐⭐⭐ — Excelente (5)</option>
                <option value="4">⭐⭐⭐⭐ — Muito bom (4)</option>
                <option value="3">⭐⭐⭐ — Bom (3)</option>
                <option value="2">⭐⭐ — Ruim (2)</option>
                <option value="1">⭐ — Péssimo (1)</option>
            </select>

            <label for="comentario">Comentário</label>
            <textarea name="comentario" id="comentario" rows="5" placeholder="Conte sua experiência com este jogo..." required></textarea>

            <input type="submit" value="Enviar avaliação" style="width:100%;">
        </form>

        <p class="auth-footer">
            <a href="{% url 'perfil' %}">← Voltar ao perfil</a>
        </p>
    </div>
</div>

{% endblock %}
