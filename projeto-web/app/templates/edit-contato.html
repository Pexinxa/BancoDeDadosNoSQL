{% extends 'template.html' %}

{% block titulo %}Editar Contato{% endblock %}

{% block conteudo %}

<div class="page-head">
    <div>
        <span class="section-label">Contatos → Editar</span>
        <h1>Editar Contato</h1>
    </div>
    <a href="{% url 'contato' %}" class="btn-ghost-sm">← Voltar</a>
</div>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Salvar alterações">
</form>

{% endblock %}
