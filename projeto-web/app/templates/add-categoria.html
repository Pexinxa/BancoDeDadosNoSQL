{% extends 'template.html' %}

{% block titulo %}Nova Categoria{% endblock %}

{% block conteudo %}

<div class="page-head">
    <div>
        <span class="section-label">Categorias → Nova</span>
        <h1>Adicionar Categoria</h1>
    </div>
    <a href="{% url 'categoria' %}" class="btn-ghost-sm">← Voltar</a>
</div>

<form action="{% url 'addcategoria' %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Adicionar">
</form>

{% endblock %}
